/* Temporales para la orientación de la cabeza */
const _look = new THREE.Vector3();
const _lookDir = new THREE.Vector3();
const _lookQ = new THREE.Quaternion();
const _lookAim = new THREE.Vector3();

/**
 * Orienta el cuello y la cabeza hacia un punto del mundo.
 * @param {object} rig
 * @param {THREE.Vector3} target punto en coordenadas de mundo
 * @param {number} maxYaw giro máximo de cabeza (rad)
 * @param {number} maxPitch inclinación máxima (rad)
 */
function lookAtTarget(rig, target, maxYaw, maxPitch) {
  rig.head.getWorldPosition(_look);
  _lookDir.copy(target).sub(_look);
  if (_lookDir.lengthSq() < 1e-8) return;
  _lookDir.normalize();
  rig.chest.getWorldQuaternion(_lookQ).invert();
  _lookDir.applyQuaternion(_lookQ);
  const yaw = clamp(Math.atan2(_lookDir.x, _lookDir.z), -maxYaw, maxYaw);
  const pitch = clamp(-Math.asin(clamp(_lookDir.y, -1, 1)), -maxPitch, maxPitch);
  rig.neck.rotation.y = lerp(rig.neck.rotation.y, yaw * 0.42, 0.22);
  rig.head.rotation.y = lerp(rig.head.rotation.y, yaw * 0.58, 0.22);
  rig.neck.rotation.x = lerp(rig.neck.rotation.x, pitch * 0.35, 0.22);
  rig.head.rotation.x = lerp(rig.head.rotation.x, pitch * 0.65, 0.22);
}

/**
 * Ciclo de carrera real: contrapenduleo de brazos, giro de caderas,
 * flexión de rodilla y apoyo del pie.
 * @param {object} rig
 * @param {number} phase fase de la zancada (rad)
 * @param {number} amount intensidad (0-1)
 */
function applyRun(rig, phase, amount) {
  const s = Math.sin(phase);
  const c = Math.cos(phase);

  // Caderas: giro longitudinal y balanceo lateral
  rig.hips.rotation.y = -s * 0.18 * amount;
  rig.hips.rotation.z = c * 0.05 * amount;
  // Tren superior: contrarrota frente a las caderas
  rig.spine.rotation.y = s * 0.13 * amount;
  rig.chest.rotation.y = s * 0.17 * amount;
  rig.chest.rotation.x = 0.06 * amount;

  // Piernas
  rig.legL.hip.rotation.x = s * 0.78 * amount;
  rig.legR.hip.rotation.x = -s * 0.78 * amount;
  rig.legL.knee.rotation.x = -(0.18 + 1.05 * clamp(-s, 0, 1)) * amount;
  rig.legR.knee.rotation.x = -(0.18 + 1.05 * clamp(s, 0, 1)) * amount;
  rig.legL.ankle.rotation.x = (0.22 + 0.32 * clamp(s, 0, 1)) * amount;
  rig.legR.ankle.rotation.x = (0.22 + 0.32 * clamp(-s, 0, 1)) * amount;

  // Brazos: contrapenduleo con codo flexionado
  rig.armL.shoulder.rotation.set(-s * 0.92 * amount, 0, 0.2 * amount);
  rig.armR.shoulder.rotation.set(s * 0.92 * amount, 0, -0.2 * amount);
  rig.armL.elbow.rotation.x = -(1.05 + 0.45 * Math.max(0, s)) * amount;
  rig.armR.elbow.rotation.x = -(1.05 + 0.45 * Math.max(0, -s)) * amount;

  // Rebote vertical (dos por zancada) e inclinación
  rig.body.position.y = Math.abs(s) * 0.032 * amount;
  rig.body.rotation.x = 0.15 * amount;
}

/** Pose de espera del lanzador: respiración, balanceo y peso en una pierna. */
function poseShooterIdle(rig, t) {
  const br = Math.sin(t * 1.9);
  rig.body.position.y = br * 0.006;
  rig.body.rotation.x = 0.03 + br * 0.008;
  rig.body.rotation.z = Math.sin(t * 0.62) * 0.015;
  rig.hips.rotation.y = Math.sin(t * 0.45) * 0.05;
  rig.spine.rotation.y = -Math.sin(t * 0.45) * 0.05;
  rig.chest.rotation.x = br * 0.022;
  rig.armL.shoulder.rotation.set(-0.15 + br * 0.05, 0, 0.21);
  rig.armR.shoulder.rotation.set(-0.15 - br * 0.05, 0, -0.21);
  rig.armL.elbow.rotation.x = -0.45;
  rig.armR.elbow.rotation.x = -0.45;
  rig.legL.hip.rotation.x = 0.05;
  rig.legR.hip.rotation.x = -0.05;
  rig.legL.knee.rotation.x = -0.09;
  rig.legR.knee.rotation.x = -0.09;
  rig.legL.ankle.rotation.x = 0.05;
  rig.legR.ankle.rotation.x = 0.05;
}

/**
 * Animación completa del lanzador: aproximación, plantón, golpeo y recuperación.
 * @param {number} t
 */
function updateShooter(t) {
  const rig = shooter.userData.rig;
  const p = t - game.kickT0;

  if (game.kickPhase === "runup") {
    const dur = 0.6;
    const k = clamp(p / dur, 0, 1);
    shooter.position.z = lerp(SHOOTER_START_Z, PENALTY_Z - 0.16, easeInOut(k));
    applyRun(rig, p * 14, 1);
    if (k >= 1) { game.kickPhase = "strike"; game.kickT0 = t; }
  } else if (game.kickPhase === "strike") {
    const k = clamp(p / 0.34, 0, 1);
    // La pierna armada se carga y después barre el balón
    const swing = k < 0.42 ? lerp(-0.5, 0.2, k / 0.42) : lerp(0.2, 0.9, (k - 0.42) / 0.58);
    // Pierna de apoyo: planta y aguanta el peso
    rig.legL.hip.rotation.x = lerp(-0.1, -0.16, k);
    rig.legL.knee.rotation.x = lerp(-0.2, -0.26, k);
    rig.legL.ankle.rotation.x = 0.14;
    // Pierna armada
    rig.legR.hip.rotation.x = swing;
    rig.legR.knee.rotation.x = -(1.3 * (1 - clamp((k - 0.18) / 0.4, 0, 1)) + 0.06);
    rig.legR.ankle.rotation.x = 0.24;
    // Giro de cadera y tronco: es lo que da potencia al tiro
    rig.hips.rotation.y = lerp(-0.32, 0.34, k);
    rig.spine.rotation.y = lerp(-0.2, 0.22, k);
    rig.chest.rotation.y = lerp(-0.22, 0.26, k);
    rig.body.rotation.x = 0.17;
    rig.body.position.y = -0.03;
    // Brazos en equilibrio
    rig.armL.shoulder.rotation.set(lerp(-0.4, -0.95, k), 0, lerp(0.5, 0.32, k));
    rig.armR.shoulder.rotation.set(lerp(0.5, 0.95, k), 0, lerp(-0.45, -0.32, k));
    rig.armL.elbow.rotation.x = -0.5;
    rig.armR.elbow.rotation.x = -0.8;
    shooter.position.z = PENALTY_Z - 0.2;
    // El balón sale en el punto de contacto
    if (!game.ballLaunched && p >= 0.1) launchBall();
    if (k >= 1) { game.kickPhase = "follow"; game.kickT0 = t; }
  } else if (game.kickPhase === "follow") {
    const k = clamp(p / 0.45, 0, 1);
    rig.legR.hip.rotation.x = lerp(0.9, 0.12, k);
    rig.legR.knee.rotation.x = lerp(-0.08, -0.28, k);
    rig.legR.ankle.rotation.x = lerp(0.24, 0.08, k);
    rig.legL.hip.rotation.x = lerp(-0.16, 0.0, k);
    rig.legL.knee.rotation.x = lerp(-0.26, -0.06, k);
    rig.legL.ankle.rotation.x = lerp(0.14, 0.04, k);
    rig.hips.rotation.y = lerp(0.34, 0.04, k);
    rig.spine.rotation.y = lerp(0.22, 0.0, k);
    rig.chest.rotation.y = lerp(0.26, 0.0, k);
    rig.armL.shoulder.rotation.set(lerp(-0.95, -0.2, k), 0, lerp(0.32, 0.22, k));
    rig.armR.shoulder.rotation.set(lerp(0.95, 0.12, k), 0, lerp(-0.32, -0.22, k));
    rig.armL.elbow.rotation.x = -0.5;
    rig.armR.elbow.rotation.x = -0.6;
    rig.body.rotation.x = lerp(0.17, 0.05, k);
    rig.body.position.y = lerp(-0.03, 0, k);
    if (k >= 1) { game.kickPhase = "recover"; game.kickT0 = t; }
  } else if (game.kickPhase === "recover") {
    const k = clamp(p / 0.7, 0, 1);
    shooter.position.z = lerp(PENALTY_Z - 0.2, SHOOTER_START_Z, easeInOut(k));
    poseShooterIdle(rig, t);
    if (k >= 1) game.kickPhase = "none";
  } else {
    poseShooterIdle(rig, t);
  }
  shooter.rotation.y = Math.PI;
  // El lanzador vigila el objetivo: la mira mientras apunta y el arco al chutar
  if (game.kickPhase === "none") _lookAim.set(game.aimX, game.aimY, 0.35);
  else _lookAim.set(0, 1.15, 0);
  lookAtTarget(rig, _lookAim, 1.0, 0.45);
}

/* ------------------- Brazos del portero (alcance y agarre) ---------- */
const ARM_LEN = 0.68;                 // hombro -> centro de la mano (sin doblar)
const REACH_NORMAL = 0.78;            // alcance de las manos (m)
const REACH_WEAK = 0.92;              // tiro flojo: el portero se estira más
const REACH_HIGH = 0.58;              // balón alto: no llega
const ARM_DOWN = new THREE.Vector3(0, -1, 0);
const _armA = new THREE.Vector3();
const _armB = new THREE.Vector3();
const _ikA = new THREE.Vector3();
const _ikDir = new THREE.Vector3();
const _ikPole = new THREE.Vector3();
const _ikUp = new THREE.Vector3();
const _ikNorm = new THREE.Vector3();
const _ikFore = new THREE.Vector3();
const _ikElbow = new THREE.Vector3();
const _ikQ = new THREE.Quaternion();
const _ikQ2 = new THREE.Quaternion();
const _ikBasis = new THREE.Matrix4();

/**
 * Cinemática inversa de dos huesos: lleva la mano hasta el punto objetivo.
 * El codo se dobla de forma natural y el hombro orienta el brazo con el ángulo
 * correcto, de modo que la mano queda exactamente sobre el balón.
 * @param {{shoulder:THREE.Group, elbow:THREE.Group, wrist:THREE.Group}} arm
 * @param {THREE.Vector3} target objetivo en coordenadas de mundo
 * @param {number} weight mezcla entre la pose base y la solución (0-1)
 */
function reachHand(arm, target, weight) {
  if (weight <= 0.001) return;
  arm.shoulder.getWorldPosition(_ikA);
  const a = Math.max(0.08, _ikA.distanceTo(arm.elbow.getWorldPosition(_armB)));
  const b = Math.max(0.08, _armB.distanceTo(arm.wrist.getWorldPosition(_armA)));
  const c = 0.085;                                    // muñeca -> centro de la mano
  const D = _ikA.distanceTo(target);
  let d = D - c;
  const dmin = Math.abs(a - b) + 0.02;
  const dmax = a + b - 0.005;
  const over = d > dmax;                              // fuera de alcance: se estira
  d = clamp(d, dmin, dmax);

  const alpha = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const beta = Math.PI - Math.acos(clamp((a * a + b * b - d * d) / (2 * a * b), -1, 1));

  // ---- Todo se calcula en el marco del mundo ----
  // Dirección al objetivo y polo de flexión (el codo se abre hacia abajo)
  _ikDir.copy(target).sub(_ikA);
  if (_ikDir.lengthSq() < 1e-8) return;
  _ikDir.normalize();
  _ikPole.set(0, -1, 0).addScaledVector(_ikDir, _ikDir.y);
  if (_ikPole.lengthSq() < 1e-6) _ikPole.set(0, 0, 1).addScaledVector(_ikDir, -_ikDir.z);
  _ikPole.normalize();
  // Normal del plano de flexión: es el eje del codo
  _ikNorm.crossVectors(_ikDir, _ikPole);
  if (_ikNorm.lengthSq() < 1e-8) return;
  _ikNorm.normalize();
  // Dirección del brazo superior: desviada del objetivo para que el codo encaje
  _ikUp.copy(_ikDir).multiplyScalar(Math.cos(alpha)).addScaledVector(_ikPole, Math.sin(alpha)).normalize();
  // Codo y antebrazo buscados
  _ikElbow.copy(_ikA).addScaledVector(_ikUp, a);
  _ikFore.copy(target).sub(_ikElbow);
  if (_ikFore.lengthSq() < 1e-8) return;
  _ikFore.normalize();

  // Base ortonormal del hombro: X = eje del codo, Y = -dirección del brazo
  const yAxis = _ikUp.clone().negate();
  const xAxis = _ikNorm.clone().addScaledVector(yAxis, -_ikNorm.dot(yAxis));
  if (xAxis.lengthSq() < 1e-8) return;
  xAxis.normalize();
  const zAxis = new THREE.Vector3().crossVectors(xAxis, yAxis);

  // Se pasa la base al marco del padre (el pecho) para orientar el hombro
  const parent = arm.shoulder.parent;
  parent.getWorldQuaternion(_ikQ).invert();
  xAxis.applyQuaternion(_ikQ);
  yAxis.applyQuaternion(_ikQ);
  zAxis.applyQuaternion(_ikQ);
  _ikBasis.makeBasis(xAxis, yAxis, zAxis);
  _ikQ2.setFromRotationMatrix(_ikBasis);
  arm.shoulder.quaternion.slerp(_ikQ2, weight);

  // Flexión del codo con signo (giro del antebrazo hasta el objetivo)
  const sin = _ikUp.clone().cross(_ikFore).dot(_ikNorm);
  const ang = Math.atan2(sin, _ikUp.dot(_ikFore));
  arm.elbow.rotation.x = lerp(arm.elbow.rotation.x, ang, weight);

  // Si el balón queda lejos, el brazo se estira (nunca se descuadra)
  if (over) {
    const k = clamp((D - c) / (a + b), 1, 1.4);
    arm.elbow.position.y = -0.32 * k;
    arm.wrist.position.y = -0.27 * k;
  }
}

/** Portero: espera, estirada y manos que persiguen el balón. */
function updateKeeper(t) {
  const rig = keeper.userData.rig;
  const side = game.keeperSide;
  let dive = 0;
  if (game.keeperDiving) dive = clamp((t - game.keeperDiveT0) / 0.42, 0, 1);
  const crouch = 1 - dive;
  const bob = Math.sin(t * 3.2) * 0.012;

  // ---- Posición de espera: cuclillas, manos abiertas ----
  rig.body.position.y = -0.17 * crouch + Math.sin(dive * Math.PI) * 0.34 + bob;
  rig.body.rotation.x = 0.2 * crouch;
  rig.body.rotation.z = 0;
  rig.hips.rotation.x = 0.12 * crouch;
  rig.hips.rotation.y = 0;
  rig.spine.rotation.x = 0.1 * crouch;
  rig.spine.rotation.y = 0;
  rig.chest.rotation.x = 0.08 * crouch;
  rig.chest.rotation.y = 0;

  // Piernas: flexionadas en la espera, extendidas en la estirada
  rig.legL.hip.rotation.x = lerp(0.62 * crouch, -0.3, dive);
  rig.legL.knee.rotation.x = lerp(-1.2 * crouch, -0.12, dive);
  rig.legL.ankle.rotation.x = lerp(0.45 * crouch, 0.1, dive);
  rig.legR.hip.rotation.x = lerp(0.62 * crouch, -0.2, dive);
  rig.legR.knee.rotation.x = lerp(-1.2 * crouch, -0.35, dive);
  rig.legR.ankle.rotation.x = lerp(0.45 * crouch, 0.12, dive);

  // Brazos: se abren HACIA AFUERA (nunca cruzados) y se adelantan al lanzador
  const spread = 0.55 + dive * 1.0;
  const forward = 0.18 + dive * 0.42;
  rig.armL.shoulder.rotation.set(-forward, 0, -spread);
  rig.armR.shoulder.rotation.set(-forward, 0, spread);
  rig.armL.elbow.rotation.set(-0.6 * crouch, 0, 0);
  rig.armR.elbow.rotation.set(-0.6 * crouch, 0, 0);
  rig.armL.elbow.position.y = -0.32;
  rig.armL.wrist.position.y = -0.27;
  rig.armR.elbow.position.y = -0.32;
  rig.armR.wrist.position.y = -0.27;

  const e = easeOut(dive);
  keeper.rotation.z = -side * 0.78 * e;
  keeper.position.y = Math.sin(e * Math.PI) * 0.5;

  // La estirada debe dejar las manos en la zona de parada, no el cuerpo
  keeper.position.x = 0;
  keeper.updateMatrixWorld(true);
  let anchorX;
  if (side > 0) anchorX = rig.armR.shoulder.getWorldPosition(_armA).x;
  else if (side < 0) anchorX = rig.armL.shoulder.getWorldPosition(_armA).x;
  else anchorX = (rig.armR.shoulder.getWorldPosition(_armA).x + rig.armL.shoulder.getWorldPosition(_armB).x) * 0.5;
  keeper.position.x = (side * 2.3 - anchorX) * e;
  keeper.updateMatrixWorld(true);

  // ---- Las manos persiguen el balón y lo desvían ----
  const catching = game.keeperSaveT0 >= 0 && (t - game.keeperSaveT0) < 0.26;
  if (game.keeperDiving && (game.mode === "flying" || catching)) {
    const target = catching ? game.keeperCatchPos : ball.position;

    // Se usa el brazo más cercano al balón (el que realmente puede llegar)
    rig.armR.shoulder.getWorldPosition(_armA);
    rig.armL.shoulder.getWorldPosition(_armB);
    const dR = _armA.distanceTo(target);
    const dL = _armB.distanceTo(target);
    const nearArm = dR <= dL ? rig.armR : rig.armL;
    const farArm = dR <= dL ? rig.armL : rig.armR;
    const dist = Math.min(dR, dL);

    // Peso de la mezcla: el brazo se extiende cuando el balón está al alcance
    const w = catching
      ? 1
      : clamp((2.4 - dist) / 1.2, 0, 1) * clamp(dive * 1.6, 0, 1);
    reachHand(nearArm, target, w);

    // El otro brazo acompaña el gesto, pero sin cruzarse por delante
    reachHand(farArm, target, w * 0.22);
  }

  // El portero vigila el balón en todo momento
  lookAtTarget(rig, ball.position, 1.15, 0.5);
}

/* =====================================================================
   ENTRADA, MIRILLA Y HUD
   ===================================================================== */
function updateAim(dt) {
  if (game.mode === "aim") {
    if (keys.has("ArrowLeft") || keys.has("a")) game.aimX -= AIM_SPEED_X * dt;
    if (keys.has("ArrowRight") || keys.has("d")) game.aimX += AIM_SPEED_X * dt;
    if (keys.has("ArrowUp") || keys.has("w")) game.aimY += AIM_SPEED_Y * dt;
    if (keys.has("ArrowDown") || keys.has("s")) game.aimY -= AIM_SPEED_Y * dt;
    game.aimX = clamp(game.aimX, AIM_MIN_X, AIM_MAX_X);
    game.aimY = clamp(game.aimY, AIM_MIN_Y, AIM_MAX_Y);

    if (game.charging) {
      game.power += game.powerDir * 105 * dt;
      if (game.power >= 100) { game.power = 100; game.powerDir = -1; }
      if (game.power <= 0) { game.power = 0; game.powerDir = 1; }
    }
  }
  const visible = game.mode === "aim";
  aimMarker.visible = visible; aimDot.visible = visible;
  aimMarker.position.set(game.aimX, game.aimY, 0.35);
  aimDot.position.set(game.aimX, game.aimY, 0.36);
  aimMarker.lookAt(camera.position);
}

function updateHUD() {
  el.goals.textContent = String(game.goals);
  el.misses.textContent = String(game.misses);
  el.shotsLeft.textContent = String(game.shotsLeft);
  const pct = Math.round(game.power);
  el.powerFill.style.width = pct + "%";
  el.powerBar.setAttribute("aria-valuenow", String(pct));
}
function showBanner(text, kind) {
  el.banner.textContent = text;
  el.banner.classList.toggle("is-miss", kind === "miss");
  el.banner.classList.add("is-visible");
}
function hideBanner() { el.banner.classList.remove("is-visible"); }

function projectToScreen(pos) {
  const v = pos.clone().project(camera);
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  return { x: (v.x * 0.5 + 0.5) * w, y: (-v.y * 0.5 + 0.5) * h, visible: v.z < 1 };
}
function updateLabels() {
  const ak = new THREE.Vector3();
  keeper.userData.rig.head.getWorldPosition(ak);
  ak.y += 0.3;
  const pk = projectToScreen(ak);
  el.tagKeeper.style.display = pk.visible ? "block" : "none";
  el.tagKeeper.style.transform = `translate(-50%,-100%) translate(${pk.x}px, ${pk.y}px)`;

  const as = new THREE.Vector3();
  shooter.userData.rig.head.getWorldPosition(as);
  as.y += 0.3;
  const ps = projectToScreen(as);
  el.tagPlayer.style.display = ps.visible ? "block" : "none";
  el.tagPlayer.style.transform = `translate(-50%,-100%) translate(${ps.x}px, ${ps.y}px)`;
}

/* =====================================================================
   BUCLE
   ===================================================================== */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  updateAim(dt);
  updateShooter(t);
  updateBall(dt);
  updateKeeper(t);
  nets.forEach((n) => { n.mesh.updateMatrixWorld(true); n.step(dt, ball.position, BALL_R, ballVel); });

  if (game.mode === "result" && t >= game.resultUntil) {
    if (game.shotsLeft <= 0) {
      game.mode = "end";
      const final = game.goals > game.misses ? "VICTORIA" : game.goals === game.misses ? "EMPATE" : "DERROTA";
      showBanner(final, game.goals >= game.misses ? "goal" : "miss");
      window.setTimeout(resetMatch, 2000);
    } else {
      resetShot();
    }
  }

  updateHUD();
  updateLabels();

  const targetX = game.mode === "aim" ? 0 : ball.position.x * 0.06;
  camera.position.x = lerp(camera.position.x, targetX, 0.05);
  camera.lookAt(0, 1.05, 0.5);

  renderer.render(scene, camera);
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
window.addEventListener("keydown", (event) => {
  const k = event.key;
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(k)) event.preventDefault();
  keys.add(k);
  if ((k === " " || k === "Enter") && !event.repeat && game.mode === "aim") {
    game.charging = true; game.power = 0; game.powerDir = 1;
  }
});
window.addEventListener("keyup", (event) => {
  const k = event.key;
  keys.delete(k);
  if ((k === " " || k === "Enter") && game.charging) requestShoot();
});
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

resetMatch();
animate();
</script>
